[build-system]
requires = ["setuptools>=83.0.0,<84", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "quantitative-crypto-portfolio-risk-framework"
version = "0.5.0"
description = "Quantitative crypto portfolio risk analytics framework"
readme = "README.md"
authors = [{ name = "Mohamadreza Heidari" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "pandas>=2.0,<3",
    "numpy>=1.25,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.7,<4",
    "requests>=2.31,<3",
    "PyYAML>=6.0,<7",
    "yfinance>=0.2.36,<2",
    "python-dotenv>=1.0,<2",
    "cvxpy>=1.4,<2",
]

[project.optional-dependencies]
app = ["streamlit>=1.32,<2"]
dev = [
    "build>=1.2,<2",
    "pytest>=7.4,<10",
    "pytest-cov>=4.1,<8",
    "ruff>=0.14,<1",
    "setuptools>=83.0.0,<84",
    "wheel>=0.45,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["var_cvar_crypto_risk"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
