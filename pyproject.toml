[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "var-cvar-crypto-risk-engine"
version = "0.5.0"
description = "Flexible VaR/CVaR crypto portfolio risk analytics engine"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.25",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "requests>=2.31",
    "PyYAML>=6.0",
    "yfinance>=0.2.36",
    "python-dotenv>=1.0",
    "cvxpy>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
app = ["streamlit>=1.32"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
