name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  specifications:
    name: OpenSpec validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENSPEC_TELEMETRY: "0"
      npm_config_ignore_scripts: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate active OpenSpec capabilities
        run: >-
          npx --yes @fission-ai/openspec@1.3.1
          validate --all --strict --no-interactive

  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Verify and sync locked environment
        run: |
          uv lock --check
          uv sync --locked --extra app --extra dev \
            --python "${{ matrix.python-version }}"

      - name: Verify package import
        run: uv run --locked --no-sync python -c "import var_cvar_crypto_risk"

      - name: Run regression suite
        run: uv run --locked --no-sync python -m pytest -p no:cacheprovider -q

  quality:
    name: Quality, coverage, build, and app smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Verify and sync locked environment
        run: |
          uv lock --check
          uv sync --locked --extra app --extra dev --python "3.13"

      - name: Lint
        run: >-
          uv run --locked --no-sync ruff check
          app.py src tests scripts

      - name: Verify public/private repository boundary
        run: uv run --locked --no-sync python -m scripts.check_public_boundary

      - name: Verify public Git history boundary
        run: uv run --locked --no-sync python -m scripts.check_git_history_boundary

      - name: Test with coverage floor
        run: |
          uv run --locked --no-sync python -m pytest -p no:cacheprovider -q \
            --cov=var_cvar_crypto_risk \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Build wheel and source distribution
        run: uv run --locked --no-sync python -m build --no-isolation

      - name: Verify built wheel import
        shell: bash
        run: |
          python -m venv /tmp/artifact-venv
          /tmp/artifact-venv/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/artifact-venv/bin/python -c "import var_cvar_crypto_risk"

      - name: Streamlit startup smoke test
        shell: bash
        run: |
          uv run --locked --no-sync python -m streamlit run app.py \
            --server.headless true \
            --server.port 8501 \
            > /tmp/streamlit.log 2>&1 &
          streamlit_pid=$!
          trap 'kill "$streamlit_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/streamlit.log
          exit 1
