name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[app,dev]"

      - name: Verify package import
        run: python -c "import var_cvar_crypto_risk"

      - name: Run regression suite
        run: python -m pytest -p no:cacheprovider -q

  quality:
    name: Quality, coverage, build, and app smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[app,dev]"

      - name: Lint
        run: ruff check app.py run_demo.py run_phase5_optimization_demo.py src tests

      - name: Test with coverage floor
        run: |
          python -m pytest -p no:cacheprovider -q \
            --cov=var_cvar_crypto_risk \
            --cov-report=term-missing \
            --cov-fail-under=68

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify built wheel import
        shell: bash
        run: |
          python -m venv /tmp/artifact-venv
          /tmp/artifact-venv/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/artifact-venv/bin/python -c "import var_cvar_crypto_risk"

      - name: Streamlit startup smoke test
        shell: bash
        run: |
          python -m streamlit run app.py \
            --server.headless true \
            --server.port 8501 \
            > /tmp/streamlit.log 2>&1 &
          streamlit_pid=$!
          trap 'kill "$streamlit_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/streamlit.log
          exit 1
